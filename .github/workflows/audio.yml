name: Fabriquer les sons

on:
  push:
    branches: [main]
    paths:
      - audio/**
      - .github/workflows/audio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  sons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer la voix
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts==1.3.0
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium
          curl -sSL -o /tmp/voice.onnx "$base/ar_JO-kareem-medium.onnx"
          curl -sSL -o /tmp/voice.onnx.json "$base/ar_JO-kareem-medium.onnx.json"
      - name: Fabriquer les sons
        run: python audio/make_audio.py /tmp/voice.onnx
      - name: Enregistrer les sons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/audio
          git diff --cached --quiet && exit 0
          git commit -m "Sons fabriqués automatiquement"
          git push
