name: Contrôle des sons

on:
  push:
    branches: [main]
    paths:
      - tools/audit_audio.py
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer
        run: pip install -q edge-tts faster-whisper
      - name: Réécouter les sons
        run: python tools/audit_audio.py
      - name: Enregistrer le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin main
          git add tools/audit
          git diff --cached --quiet && exit 0
          git commit -m "Rapport de contrôle des sons"
          git push
